[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piis"
version = "0.1.0"
description = "Telecom Production Incident Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "pyarrow>=15",
  "pydantic>=2.7,<3",
  "jsonschema>=4.22",
  "scikit-learn>=1.5",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
retrieval = ["sentence-transformers>=3", "faiss-cpu>=1.8"]
observability = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
