services:
  piis-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: piis-api
    restart: unless-stopped
    ports:
      - "${PIIS_PORT:-8000}:8000"
    environment:
      - PIIS_ENVIRONMENT=${PIIS_ENVIRONMENT:-staging}
      - PIIS_PORT=8000
      - PIIS_HOST=0.0.0.0
      - PIIS_LOG_LEVEL=${PIIS_LOG_LEVEL:-info}
    volumes:
      - piis_data:/app/data
      - piis_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: piis-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  piis_data:
  piis_artifacts:
